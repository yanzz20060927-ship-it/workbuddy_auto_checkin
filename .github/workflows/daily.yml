name: Buddy 加油站每日自动化

on:
  schedule:
    # GitHub 的 cron 是尽力而为：高负载时会延迟，甚至静默丢弃整次运行。
    # 因此设三个时段互为备份 —— 只要有一个跑到，当天就完成了。
    # 脚本是幂等的：已签过只会返回「今日已签过」，名额用完不会重派，
    # 所以多触发不会重复领取。
    #
    # 间隔取 6 小时，是因为猫猫旅行时长最长 4 小时（travel/config 的
    # duration_hours_max），这样下一轮运行时它必定已经到家，可以领回礼物。
    # 三个点都落在 :10，避开 GitHub 文档提示的整点高负载期。
    #
    # 注意 cron 按 UTC 计时，下面是 UTC，括号内为北京时间（UTC+8）。
    - cron: "10 0 * * *"    # 00:10 UTC = 08:10 北京（主时段）
    - cron: "10 6 * * *"    # 06:10 UTC = 14:10 北京（备份）
    - cron: "10 12 * * *"   # 12:10 UTC = 20:10 北京（备份）
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wb-daily
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 定位 Python 解释器
        id: py
        # 解释器路径不写死版本号，动态取 runner 上可用的解释器
        run: |
          set -euo pipefail
          PY="$(command -v python3 || command -v python || true)"
          if [ -z "$PY" ]; then
            echo "未找到可用的 Python 解释器" >&2
            exit 1
          fi
          "$PY" -c 'import sys; print("使用解释器:", sys.executable, sys.version.split()[0])'
          echo "python_path=$PY" >> "$GITHUB_OUTPUT"

      - name: 执行签到与派猫猫
        id: run
        env:
          WB_ACCESS_TOKEN: ${{ secrets.WB_ACCESS_TOKEN }}
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          WB_ENDPOINT: https://copilot.tencent.com
          WB_RESULT_FILE: ${{ runner.temp }}/wb_result.json
        run: |
          set -uo pipefail
          PY="${{ steps.py.outputs.python_path }}"
          set +e
          "$PY" wb_auto.py
          code=$?
          set -e
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          # 签到成功即成功：脚本自身已把猫猫失败与签到结论解耦，
          # 这里统一以 0 退出，仅用 warning 提示存在未完成项。
          if [ "$code" -ne 0 ]; then
            echo "::warning::本轮存在未完成项，详见上方日志与飞书卡片"
          fi
          exit 0

      - name: 汇总
        if: always()
        env:
          RESULT_FILE: ${{ runner.temp }}/wb_result.json
        run: |
          set -uo pipefail
          {
            echo "### Buddy 加油站每日自动化"
            echo ""
            echo "- 运行时间：$(date -u '+%Y-%m-%d %H:%M:%S UTC')（cron 为 UTC）"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -f "$RESULT_FILE" ]; then
            cat "$RESULT_FILE" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- 未产出结论文案，请查看上方日志" >> "$GITHUB_STEP_SUMMARY"
          fi

  keepalive:
    # 防「60 天无活动自动禁用」：public 仓库的定时任务会被 GitHub 自动关闭，
    # 而定时运行本身不算活动（只认 commit/push）。这里用两个手段兜底：
    #   1) 调 enable 接口把计时清零（未文档化，但实践有效）
    #   2) 每 25 天产生一次真实的空提交（确定算作仓库活动）
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: write
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 重置定时任务计时并维持活动
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail

          # 手段 1：把 schedule 的 60 天计时清零
          if gh api -X PUT "repos/$GITHUB_REPOSITORY/actions/workflows/daily.yml/enable" --silent; then
            echo "已调用 enable，计时清零"
          else
            echo "::warning::enable 调用失败，仅依赖提交保活"
          fi

          # 手段 2：距上次保活提交超过 25 天就再提交一次
          LAST=$(git log -1 --format=%ct -- .keepalive 2>/dev/null || echo 0)
          NOW=$(date +%s)
          if [ -z "$LAST" ] || [ "$LAST" = "0" ]; then
            AGE=999
          else
            AGE=$(( (NOW - LAST) / 86400 ))
          fi
          echo "上次保活提交距今 ${AGE} 天"

          if [ "$AGE" -ge 25 ]; then
            date -u '+%Y-%m-%dT%H:%M:%SZ' > .keepalive
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .keepalive
            git commit -m "chore: keepalive $(date -u +%Y-%m-%d)"
            git push
            echo "已提交保活（这是确定算作仓库活动的信号）"
          else
            echo "未到 25 天，跳过提交"
          fi
